<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vertex Lot">
<meta name="theme-color" content="#0a1611">
<link rel="apple-touch-icon" href="lotcalc-icon.png">
<link rel="icon" type="image/png" href="lotcalc-icon.png">
<link rel="manifest" href="manifest.webmanifest">

<title>Vertex Algo · Lot Calculator</title>
<style>
  :root{
    --bg:rgb(10,22,17);--hdr-bg:rgb(7,14,11);--teal:rgb(29,158,117);--teal-soft:rgba(29,158,117,.25);--dimteal:rgb(15,70,52);--tsl-bg:rgb(9,30,23);--white:rgb(200,220,215);--muted:rgb(80,110,100);--edit-bg:rgb(6,14,10)
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%}
  body{font-family:Arial,Helvetica,sans-serif;background:#0a1611;color:var(--white);display:flex;align-items:center;justify-content:center;padding:max(18px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom))}
  .panel{width:100%;max-width:360px;background:var(--bg);border:1px solid var(--teal);border-radius:14px;overflow:hidden}
  .header{background:var(--hdr-bg);border-bottom:1px solid var(--teal);padding:16px 18px;display:flex;align-items:center;gap:12px}
  .logo{display:flex;align-items:flex-end;gap:3px;height:28px}.logo span{width:5px;background:var(--teal);border-radius:1px}.logo span:nth-child(1){height:20px}.logo span:nth-child(2){height:28px}.logo span:nth-child(3){height:23px}
  .brand .title{color:var(--teal);font-weight:bold;font-size:18px;letter-spacing:.5px}.brand .sub{color:var(--muted);font-size:12px;margin-top:2px}
  .body{padding:8px 18px 0}.row{display:flex;align-items:center;justify-content:space-between;padding:11px 0}.row label{font-size:15px;color:var(--white)}
  input{background:var(--edit-bg);border:1px solid var(--dimteal);border-radius:9px;color:var(--white);font-family:inherit;font-size:18px;font-weight:bold;height:46px;padding:0 14px;outline:none}input:focus{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal-soft)}.wide{width:150px;text-align:left}.narrow{width:104px;text-align:center}
  select{background:var(--edit-bg);border:1px solid var(--dimteal);border-radius:9px;color:var(--white);font-family:inherit;font-size:16px;font-weight:bold;height:46px;padding:0 10px;outline:none;width:150px;-webkit-appearance:none;appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0 L5 6 L10 0 Z' fill='%231D9E75'/></svg>");background-repeat:no-repeat;background-position:right 14px center}select:focus{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal-soft)}
  .sep{height:1px;background:var(--dimteal);margin:6px 0}.sep.teal{background:var(--teal)}
  .tsl{display:flex;align-items:center;justify-content:space-between;background:var(--tsl-bg);border:1px solid var(--dimteal);border-radius:9px;padding:12px 16px;margin:8px 0 4px}.tsl .lbl{color:var(--teal);font-size:15px}.tsl .val{color:var(--teal);font-size:16px;font-weight:bold}
  .result{padding:8px 0 2px}.result .line{display:flex;align-items:baseline;justify-content:space-between;padding:6px 0}.result .k{color:var(--muted);font-size:15px}.result .dollar{color:var(--white);font-size:17px;font-weight:bold}.result .lot{color:var(--teal);font-size:34px;font-weight:bold;line-height:1}
  .footer{padding:8px 0 16px}.footer div{color:var(--muted);font-size:12px;line-height:1.8}
</style>
</head>
<body>
<div class="panel">
  <div class="header"><div class="logo"><span></span><span></span><span></span></div><div class="brand"><div class="title">VERTEX ALGO</div><div class="sub">Lot Calculator</div></div></div>
  <div class="body">
    <div class="row"><label for="asset">Asset</label><select id="asset"><option value="XAUUSD">XAUUSD</option><option value="GBPUSD">GBPUSD</option><option value="EURUSD">EURUSD</option><option value="USDCAD">USDCAD</option><option value="NDX100">NDX100</option><option value="US30">US30</option></select></div>
    <div class="sep"></div>
    <div class="row"><label for="balance">Balance ($)</label><input id="balance" class="wide" type="text" inputmode="decimal" value="10000"></div>
    <div class="row"><label for="risk">Risk %</label><input id="risk" class="wide" type="text" inputmode="decimal" value="1.0"></div>
    <div class="sep"></div>
    <div class="row"><label for="sl">SL distance (pts)</label><input id="sl" class="narrow" type="text" inputmode="decimal" value="200"></div>
    <div class="row"><label for="spread">Spread (pts)</label><input id="spread" class="narrow" type="text" inputmode="decimal" value="30"></div>
    <div class="row" id="priceRow" style="display:none"><label for="price">Entry price</label><input id="price" class="wide" type="text" inputmode="decimal" value="1.38000"></div>
    <div class="tsl"><div class="lbl">Total SL</div><div class="val" id="totalSL">230 pts</div></div>
    <div class="sep teal"></div>
    <div class="result"><div class="line"><span class="k">Target risk</span><span class="dollar" id="dollar">$ 100.00</span></div><div class="line"><span class="k">Est. commission</span><span class="dollar" id="commission">$ 0.00</span></div><div class="line"><span class="k">Lot size</span><span class="lot" id="lot">0.43</span></div></div>
    <div class="footer"><div id="formula">Risk ÷ (SL cost + commission per lot)</div><div id="pvInfo">XAUUSD · 1 pt = $1.00 / lot</div><div id="commissionInfo">FundedNext Stellar 2-Step commission included</div></div>
  </div>
</div>
<script>
var ASSETS={XAUUSD:{type:'metal',fixedPV:1},GBPUSD:{type:'forexUsdQuote',fixedPV:1},EURUSD:{type:'forexUsdQuote',fixedPV:1},USDCAD:{type:'forexUsdBase'},NDX100:{type:'index',fixedPV:1},US30:{type:'index',fixedPV:1}};
var el=function(id){return document.getElementById(id)},num=function(id){var v=parseFloat(el(id).value);return isNaN(v)?0:v};
function pointValue(asset,price){var a=ASSETS[asset];if(a.fixedPV)return a.fixedPV;if(asset==='USDCAD')return price>0?1/price:0;return 0}
function commissionPerLot(asset,price){if(asset==='EURUSD'||asset==='GBPUSD'||asset==='USDCAD')return 5;if(asset==='NDX100'||asset==='US30')return 0;if(asset==='XAUUSD')return price>0?100*price*0.000016:0;return 0}
function updatePriceRow(){var asset=el('asset').value;var needsPrice=asset==='USDCAD'||asset==='XAUUSD';el('priceRow').style.display=needsPrice?'flex':'none';if(asset==='USDCAD'&&(num('price')>10||num('price')===0))el('price').value='1.38000';if(asset==='XAUUSD'&&num('price')<100)el('price').value='3400.00'}
function calculate(){var asset=el('asset').value;updatePriceRow();var balance=num('balance'),risk=num('risk'),sl=num('sl'),spread=num('spread'),price=num('price');var pv=pointValue(asset,price),totalSL=sl+spread,targetRisk=balance*(risk/100),cpl=commissionPerLot(asset,price);var riskPerLot=totalSL*pv+cpl,lot=riskPerLot>0?targetRisk/riskPerLot:0,commission=lot*cpl;el('totalSL').textContent=totalSL.toFixed(0)+' pts';el('dollar').textContent='$ '+targetRisk.toFixed(2);el('commission').textContent='$ '+commission.toFixed(2);el('lot').textContent=lot.toFixed(2);el('formula').textContent='$'+targetRisk.toFixed(2)+' ÷ (('+totalSL.toFixed(0)+' pts × $'+pv.toFixed(4)+') + $'+cpl.toFixed(2)+' comm/lot) = '+lot.toFixed(4);el('pvInfo').textContent=asset+' · Point value = $'+pv.toFixed(4)+' / lot';if(asset==='XAUUSD')el('commissionInfo').textContent='Metal commission: 0.0016% of notional at entry';else if(asset==='NDX100'||asset==='US30')el('commissionInfo').textContent='Index commission: $0 / lot';else el('commissionInfo').textContent='Forex commission: $5 / lot'}
el('asset').addEventListener('change',calculate);['balance','risk','sl','spread','price'].forEach(function(id){el(id).addEventListener('input',calculate)});calculate();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){})})}
</script>
</body>
</html>
