<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<!-- Home-screen web-app settings (iOS) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vertex Lot">
<meta name="theme-color" content="#0a1611">
<link rel="apple-touch-icon" href="lotcalc-icon.png">

<title>Vertex Algo · Lot Calculator</title>
<style>
  :root{
    --bg:        rgb(10,22,17);
    --hdr-bg:    rgb(7,14,11);
    --teal:      rgb(29,158,117);
    --teal-soft: rgba(29,158,117,.25);
    --dimteal:   rgb(15,70,52);
    --tsl-bg:    rgb(9,30,23);
    --white:     rgb(200,220,215);
    --muted:     rgb(80,110,100);
    --edit-bg:   rgb(6,14,10);
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ min-height:100%; }
  body{
    font-family:Arial, Helvetica, sans-serif;
    background:#0a1611;
    color:var(--white);
    display:flex; align-items:center; justify-content:center;
    padding:max(18px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));
  }

  .panel{
    width:100%; max-width:360px;
    background:var(--bg);
    border:1px solid var(--teal);
    border-radius:14px;
    overflow:hidden;
  }

  /* header */
  .header{
    background:var(--hdr-bg);
    border-bottom:1px solid var(--teal);
    padding:16px 18px;
    display:flex; align-items:center; gap:12px;
  }
  .logo{ display:flex; align-items:flex-end; gap:3px; height:28px; }
  .logo span{ width:5px; background:var(--teal); border-radius:1px; }
  .logo span:nth-child(1){ height:20px; }
  .logo span:nth-child(2){ height:28px; }
  .logo span:nth-child(3){ height:23px; }
  .brand .title{ color:var(--teal); font-weight:bold; font-size:18px; letter-spacing:.5px; }
  .brand .sub{ color:var(--muted); font-size:12px; margin-top:2px; }

  .body{ padding:8px 18px 0; }

  .row{
    display:flex; align-items:center; justify-content:space-between;
    padding:11px 0;
  }
  .row label{ font-size:15px; color:var(--white); }

  input{
    background:var(--edit-bg);
    border:1px solid var(--dimteal);
    border-radius:9px;
    color:var(--white);
    font-family:inherit; font-size:18px; font-weight:bold;
    height:46px; padding:0 14px;
    outline:none;
  }
  input:focus{ border-color:var(--teal); box-shadow:0 0 0 2px var(--teal-soft); }
  .wide{ width:150px; text-align:left; }
  .narrow{ width:104px; text-align:center; }

  .sep{ height:1px; background:var(--dimteal); margin:6px 0; }
  .sep.teal{ background:var(--teal); }

  /* total SL */
  .tsl{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--tsl-bg);
    border:1px solid var(--dimteal);
    border-radius:9px;
    padding:12px 16px;
    margin:8px 0 4px;
  }
  .tsl .lbl{ color:var(--teal); font-size:15px; }
  .tsl .val{ color:var(--teal); font-size:16px; font-weight:bold; }

  /* result */
  .result{ padding:8px 0 2px; }
  .result .line{
    display:flex; align-items:baseline; justify-content:space-between;
    padding:6px 0;
  }
  .result .k{ color:var(--muted); font-size:15px; }
  .result .dollar{ color:var(--white); font-size:17px; font-weight:bold; }
  .result .lot{ color:var(--teal); font-size:34px; font-weight:bold; line-height:1; }

  /* button */
  .btn{
    width:100%;
    background:var(--teal); color:var(--bg);
    font-family:inherit; font-weight:bold; font-size:17px; letter-spacing:1px;
    border:none; border-radius:10px;
    height:54px;
    margin:14px 0 6px;
    cursor:pointer;
  }
  .btn:active{ filter:brightness(.9); }

  /* footer */
  .footer{ padding:8px 0 16px; }
  .footer div{ color:var(--muted); font-size:12px; line-height:1.8; }
</style>
</head>
<body>
  <div class="panel">
    <div class="header">
      <div class="logo"><span></span><span></span><span></span></div>
      <div class="brand">
        <div class="title">VERTEX ALGO</div>
        <div class="sub">XAUUSD · Lot Calculator</div>
      </div>
    </div>

    <div class="body">
      <div class="row">
        <label for="balance">Balance ($)</label>
        <input id="balance" class="wide" type="text" inputmode="decimal" value="10000">
      </div>
      <div class="row">
        <label for="risk">Risk %</label>
        <input id="risk" class="wide" type="text" inputmode="decimal" value="1.0">
      </div>

      <div class="sep"></div>

      <div class="row">
        <label for="sl">SL distance (pts)</label>
        <input id="sl" class="narrow" type="text" inputmode="decimal" value="200">
      </div>
      <div class="row">
        <label for="spread">Spread (pts)</label>
        <input id="spread" class="narrow" type="text" inputmode="decimal" value="30">
      </div>

      <div class="tsl">
        <div class="lbl">Total SL</div>
        <div class="val" id="totalSL">230 pts</div>
      </div>

      <div class="sep teal"></div>

      <div class="result">
        <div class="line">
          <span class="k">Dollar risk</span>
          <span class="dollar" id="dollar">$ 100.00</span>
        </div>
        <div class="line">
          <span class="k">Lot size</span>
          <span class="lot" id="lot">0.43</span>
        </div>
      </div>

      <button class="btn" id="calc">CALCULATE</button>

      <div class="footer">
        <div id="formula">10000 × 1.0% ÷ 230 pts = 0.4348</div>
        <div>XAUUSD · Point value = 1</div>
      </div>
    </div>
  </div>

<script>
  var POINT_VALUE = 1; // XAUUSD
  var el  = function(id){ return document.getElementById(id); };
  var num = function(id){ var v = parseFloat(el(id).value); return isNaN(v) ? 0 : v; };

  function calculate(){
    var balance = num('balance');
    var risk    = num('risk');
    var sl      = num('sl');
    var spread  = num('spread');

    var totalSL    = sl + spread;
    var dollarRisk = balance * (risk / 100);
    var lot        = totalSL > 0 ? dollarRisk / (totalSL * POINT_VALUE) : 0;

    el('totalSL').textContent = totalSL.toFixed(0) + ' pts';
    el('dollar').textContent  = '$ ' + dollarRisk.toFixed(2);
    el('lot').textContent     = lot.toFixed(2);
    el('formula').textContent = balance + ' × ' + risk + '% ÷ ' + totalSL + ' pts = ' + lot.toFixed(4);
  }

  el('calc').addEventListener('click', calculate);
  ['balance','risk','sl','spread'].forEach(function(id){
    el(id).addEventListener('input', calculate);
  });
  calculate();
</script>
</body>
</html>
